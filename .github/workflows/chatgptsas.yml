name: Deploy ADF with Linked Templates

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # 1. Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Login to Azure with SP
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      # 3. Upload linked templates + parameters
      - name: Upload ARM artifacts
        run: |
          STORAGE_ACCOUNT="datalake31052025"
          CONTAINER="adf-artifacts"

          # Create container if not exists
          az storage container create \
            --name $CONTAINER \
            --account-name $STORAGE_ACCOUNT \
            --auth-mode login

          # Upload linked templates (overwrite existing)
          az storage blob upload-batch \
            --account-name $STORAGE_ACCOUNT \
            --auth-mode login \
            --destination $CONTAINER \
            --source arm_templates_folder \
            --overwrite

          # Upload override parameters (overwrite existing)
          az storage blob upload \
            --account-name $STORAGE_ACCOUNT \
            --auth-mode login \
            --container-name $CONTAINER \
            --file arm_templates_folder/ARMTemplateParametersForFactory.json \
            --name ARMTemplateParametersForFactor.json \
            --overwrite

      # 4. Generate SAS for templates + params using user delegation
      - name: Generate SAS URIs
        id: sas
        run: |
          STORAGE_ACCOUNT="datalake31052025"
          CONTAINER="adf-artifacts"
          EXPIRY=$(date -u -d "1 hour" '+%Y-%m-%dT%H:%MZ')

          TEMPLATE_SAS=$(az storage blob generate-sas \
            --account-name $STORAGE_ACCOUNT \
            --container-name $CONTAINER \
            --name ARMTemplateForFactory.json \
            --permissions r \
            --expiry $EXPIRY \
            --as-user \
            --auth-mode login -o tsv)

          PARAMS_SAS=$(az storage blob generate-sas \
            --account-name $STORAGE_ACCOUNT \
            --container-name $CONTAINER \
            --name ARMTemplateParametersForFactory.json \
            --permissions r \
            --expiry $EXPIRY \
            --as-user \
            --auth-mode login -o tsv)

          echo "template_uri=https://$STORAGE_ACCOUNT.blob.core.windows.net/$CONTAINER/ARMTemplateForFactory.json?$TEMPLATE_SAS" >> $GITHUB_OUTPUT
          echo "params_uri=https://$STORAGE_ACCOUNT.blob.core.windows.net/$CONTAINER/ARMTemplateParametersForFactory.json?$PARAMS_SAS" >> $GITHUB_OUTPUT

      # 5. Deploy ADF
      - name: Deploy ARM template
        run: |
          az deployment group create \
            --resource-group Ravi_RG \
            --template-uri "${{ steps.sas.outputs.template_uri }}" \
            --parameters "${{ steps.sas.outputs.params_uri }}"
