name: DSAS and Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure CLI login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Generate Blob SAS and Deploy
        run: |
          # Variables
          STORAGE_ACCOUNT="datalake31052025"
          CONTAINER="data"
          BLOB="ARMTemplateForFactory.json"
          RESOURCE_GROUP="Ravi_RG"
          EXPIRY="$(date -u -d '1 hour' +%Y-%m-%dT%H:%MZ)"   # valid for 1 hour

          echo "Generating SAS for blob: $BLOB"

          # Generate a **blob-level SAS** (read-only)
          SAS=$(az storage blob generate-sas \
            --account-name $STORAGE_ACCOUNT \
            --container-name $CONTAINER \
            --name $BLOB \
            --permissions r \
            --expiry $EXPIRY \
            --auth-mode key \
            --output tsv)

          # Build the full URL
          TEMPLATE_URI="https://$STORAGE_ACCOUNT.blob.core.windows.net/$CONTAINER/$BLOB?$SAS"

          echo "Deploying ARM template from: $TEMPLATE_URI"

          # Run the deployment
          az deployment group create \
            --resource-group $RESOURCE_GROUP \
            --template-uri "$TEMPLATE_URI" \
            --parameters "@./override_parameters/ARMTemplateParametersForFactory_DEV.json"
